# main 이 아닌 브랜치·PR 에서도 테스트를 돌려, 머지하기 전에 깨진 걸 알 수 있게 한다
name: Test

on:
  push:
    branches-ignore: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
